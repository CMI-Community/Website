name: Deploy CMI website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Require verified migrated posters
        run: node scripts/check-event-cutover.mjs staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check Blog translation credential
        shell: bash
        env:
          BLOG_OPENAI_API_KEY: ${{ secrets.BLOG_OPENAI_API_KEY }}
        run: |
          if [[ -z "$BLOG_OPENAI_API_KEY" ]]; then
            echo "::error::Configure the Blog translation secret in the production environment."
            exit 1
          fi
      - run: npm ci
      - name: Apply production D1 migrations
        run: npm run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Require verified migrated posters
        run: node scripts/check-event-cutover.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        shell: bash
        run: |
          umask 077
          blog_secrets_file="$(mktemp "$RUNNER_TEMP/cmi-blog-secrets.XXXXXX")"
          trap 'rm -- "$blog_secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({BLOG_OPENAI_API_KEY: process.env.BLOG_OPENAI_API_KEY}))' "$blog_secrets_file"
          unset BLOG_OPENAI_API_KEY
          npm run deploy:production -- --secrets-file "$blog_secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOG_OPENAI_API_KEY: ${{ secrets.BLOG_OPENAI_API_KEY }}
