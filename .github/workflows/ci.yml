name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint and public-boundary scan
        run: npm run lint

      - name: Traceability gate
        run: npm run check:trace
        env:
          TRACE_EVENT_NAME: ${{ github.event_name }}
          TRACE_PR_BODY: ${{ github.event.pull_request.body || '' }}
          TRACE_PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          TRACE_PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and D1 integration tests
        run: npm run test

      - name: Build SSR application
        run: npm run build

      - name: Wrangler staging dry-run
        run: npm run deploy:dry-run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and 390px smoke tests
        run: npm run test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
